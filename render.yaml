services:
  - type: web
    name: agente-ordenes-compra
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_EFFORT
        value: medium
      - key: ANTHROPIC_API_KEY
        sync: false # se pega en el panel de Render; nunca en el repositorio
      - key: ACCESS_KEY
        sync: false
      - key: MAX_TOKENS_SESION
        value: "400000"
      - key: MAX_TOKENS_GLOBAL
        value: "3000000"
